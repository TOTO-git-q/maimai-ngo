selectView = true
selectPartner = equipped
categoryKeys = true

; at every login, characters below this level are raised to it (new characters too); saved to the server with the next save
; charaLevel = 9999   (off in the release: raises every character of the logged-in account)
; equipPartner = 502 equips that partner at every login (done once on 2026-11-01, so off: it would undo in-game partner changes)

; login goes straight to music select as a freedom-mode play (needs AquaMai EntryToMusicSelection)
freedomEntry = false
; freedom clock (frozen 10:00 with AquaMai FreedomTimer InfinityTime): true = infinity mark, hidden = nothing
freedomInfinity = hidden
; NGO skin test (dot handoff e8ebe1e). Remove this line to go back to the stock look
#theme = theme_ngo_test
; NGO background (main circle + top strip). Remove to get the MAGiCAL scene back
#ngoBackground = ngo_bg

; cabinet stutter fix 2026-11-03 (trials: work\cabinet_runner, decision: work\fix_decision\DECISION.md).
; vsync off + 60 fps software cap took frames over 20 ms from 60-143 a chart to 0-1. Undo: set both to keep.
; 2026-11-03 11:50 reverted: in real play the 60 cap ran at 60.36 fps (16.567 ms) against the 60 Hz TV, so a frame was
; skipped about every 2.8 s and the owner saw it as worse stutter ("现在掉帧有点没法玩了"). Back to the game's vsync.
presentationVSync = keep
presentationTargetFps = keep
; one cheap [play-present] line per chart, for checking the fix with PresentMon (off 2026-11-05: tests over)
presentationDiagnostics = false

; 2026-11-05 owner: no commemorative photo (webcam shots + camera bear at the end of each song). Remove the line to get it back.
; gamePhoto = off   (owner's choice; the release keeps the stock commemorative photo)

; 2026-11-07: the animated NGO nameplates moved to the standalone Mods\NgoPlates.dll (frames LocalAssets\NgoPlates, data A588)

