selectView = true
selectPartner = equipped
categoryKeys = true

; at every login, characters below this level are raised to it (new characters too); saved to the server with the next save
; charaLevel = 9999   (off in the release: raises every character of the logged-in account)
; equipPartner = 502 equips that partner at every login (done once on 2026-11-01, so off: it would undo in-game partner changes)

; login goes straight to music select as a freedom-mode play (needs AquaMai EntryToMusicSelection)
freedomEntry = false
; freedom clock (frozen 10:00 with AquaMai FreedomTimer InfinityTime): true = infinity mark, hidden = nothing
freedomInfinity = hidden
; NGO skin test (dot handoff e8ebe1e). Remove this line to go back to the stock look
#theme = theme_ngo_test
; NGO background (main circle + top strip). Remove to get the MAGiCAL scene back
#ngoBackground = ngo_bg
